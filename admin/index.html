<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silly Gooses Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
#panel { display:none; }

input, select {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  background: #111;
  color: white;
  border: 1px solid #333;
  border-radius: 6px;
}

#dropZone {
  border: 2px dashed #444;
  padding: 30px;
  text-align: center;
  cursor: pointer;
  margin: 10px 0;
}

#dropZone.dragover {
  border-color: #00ffcc;
  background: rgba(0,255,204,0.05);
}
</style>
</head>

<body>

<nav>
  <h2>Admin Panel</h2>
  <a href="index.html">Home</a>
</nav>

<header>
  <h1>Silly Gooses Admin</h1>
  <p>Upload PDFs, Podcasts & Magazines</p>
</header>

<section>

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h2>Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
</div>

<!-- PANEL -->
<div class="card" id="panel">

  <h2>Upload Content</h2>

  <input id="title" placeholder="Title">

  <select id="section">
    <option value="english">English GCSE</option>
    <option value="podcasts">Podcasts</option>
    <option value="magazines">Magazines</option>
  </select>

  <div id="dropZone">
    Drop PDF here or click to select
    <input type="file" id="fileInput" accept="application/pdf" hidden>
  </div>

  <button class="btn" onclick="uploadFile()">Upload</button>

  <hr>

  <h2>Logout</h2>
  <button class="btn" onclick="logout()">Logout</button>

</div>

</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
      apiKey: "AIzaSyDH1cqgyywPUm0c7rAemZH_UWy1ToUIDTI",
      authDomain: "greybox-interactive.firebaseapp.com",
      projectId: "greybox-interactive",
      storageBucket: "greybox-interactive.firebasestorage.app",
      messagingSenderId: "389806524436",
      appId: "1:389806524436:web:39b013c9cd4486d623bf01"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

const loginBox = document.getElementById("loginBox");
const panel = document.getElementById("panel");

const ADMIN_EMAIL = "YOUR_ADMIN_EMAIL";

let selectedFile = null;

/* LOGIN */
window.login = function () {
  signInWithEmailAndPassword(
    auth,
    document.getElementById("email").value,
    document.getElementById("password").value
  );
};

window.logout = () => signOut(auth);

/* AUTH CHECK */
onAuthStateChanged(auth, user => {
  if (user && user.email === ADMIN_EMAIL) {
    loginBox.style.display = "none";
    panel.style.display = "block";
  } else {
    loginBox.style.display = "block";
    panel.style.display = "none";
  }
});

/* DRAG + DROP */
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");

dropZone.onclick = () => fileInput.click();

fileInput.onchange = e => {
  selectedFile = e.target.files[0];
  dropZone.innerText = selectedFile.name;
};

dropZone.addEventListener("dragover", e => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");

  selectedFile = e.dataTransfer.files[0];
  dropZone.innerText = selectedFile.name;
});

/* UPLOAD */
window.uploadFile = async function () {
  if (!selectedFile) return alert("No file selected");

  const title = document.getElementById("title").value;
  const section = document.getElementById("section").value;

  const fileRef = ref(storage, `${section}/${Date.now()}-${selectedFile.name}`);

  await uploadBytes(fileRef, selectedFile);
  const url = await getDownloadURL(fileRef);

  await addDoc(collection(db, "content"), {
    title,
    section,
    url,
    created: Date.now()
  });

  alert("Uploaded!");
};
</script>

</body>
</html>
