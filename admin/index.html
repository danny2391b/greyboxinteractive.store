<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel | Silly Gooses</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../style.css">

<style>
#panel { display:none; }

input, select {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  background: #111;
  color: white;
  border: 1px solid #333;
  border-radius: 6px;
}

#dropZone {
  border: 2px dashed #444;
  padding: 30px;
  text-align: center;
  cursor: pointer;
  margin: 10px 0;
}

#dropZone.dragover {
  border-color: #00ffcc;
  background: rgba(0,255,204,0.05);
}
</style>
</head>

<body>

<nav>
  <h2>Admin Panel</h2>
  <a href="index.html">Home</a>
</nav>

<header>
  <h1>Silly Gooses Admin</h1>
  <p>Upload games + PDFs</p>
</header>

<section>

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h2>Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="card" id="panel">

  <h2>Add Game</h2>

  <input id="name" placeholder="Game Name">
  <input id="dev" placeholder="Developer">
  <input id="img" placeholder="Image URL">
  <input id="link" placeholder="Game Link">

  <button class="btn" onclick="addGame()">Add Game</button>

  <hr>

  <h2>Upload PDF (Silly Gooses)</h2>

  <input id="title" placeholder="PDF Title">

  <select id="section">
    <option value="english">English GCSE</option>
    <option value="podcasts">Podcasts</option>
    <option value="magazines">Magazines</option>
  </select>

  <div id="dropZone">
    Drop PDF here or click to select
    <input type="file" id="fileInput" accept="application/pdf" hidden>
  </div>

  <button class="btn" onclick="uploadPDF()">Upload PDF</button>

  <hr>

  <h2>Games</h2>
  <div id="list"></div>

  <button class="btn" onclick="logout()">Logout</button>
</div>

</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
      apiKey: "AIzaSyDH1cqgyywPUm0c7rAemZH_UWy1ToUIDTI",
      authDomain: "greybox-interactive.firebaseapp.com",
      projectId: "greybox-interactive",
      storageBucket: "greybox-interactive.appspot.com",
      messagingSenderId: "389806524436",
      appId: "1:389806524436:web:39b013c9cd4486d623bf01"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

const loginBox = document.getElementById("loginBox");
const panel = document.getElementById("panel");

const ADMIN_EMAIL = "danny23912381b@gmail.com";
let selectedFile = null;

/* LOGIN */
window.login = function () {
  signInWithEmailAndPassword(
    auth,
    document.getElementById("email").value,
    document.getElementById("password").value
  ).catch(err => alert(err.message));
};

window.logout = () => signOut(auth);

/* AUTH */
onAuthStateChanged(auth, user => {
  if (user && user.email === ADMIN_EMAIL) {
    loginBox.style.display = "none";
    panel.style.display = "block";
    loadGames();
  } else {
    loginBox.style.display = "block";
    panel.style.display = "none";

    if (user) signOut(auth);
  }
});

/* GAME SYSTEM */
window.addGame = async function () {
  const name = document.getElementById("name").value;
  const dev = document.getElementById("dev").value;
  const img = document.getElementById("img").value;
  const link = document.getElementById("link").value;

  await addDoc(collection(db, "games"), {
    name,
    developer: dev,
    image: img,
    link
  });

  loadGames();
};

async function loadGames() {
  const snap = await getDocs(collection(db, "games"));
  const list = document.getElementById("list");

  list.innerHTML = "";

  snap.forEach(d => {
    const g = d.data();

    list.innerHTML += `
      <div class="card">
        <h3>${g.name}</h3>
        <p>${g.developer}</p>
        <button class="btn" onclick="deleteGame('${d.id}')">Delete</button>
      </div>
    `;
  });
}

window.deleteGame = async function (id) {
  await deleteDoc(doc(db, "games", id));
  loadGames();
};

/* DRAG & DROP */
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");

dropZone.onclick = () => fileInput.click();

fileInput.onchange = e => {
  selectedFile = e.target.files[0];
  dropZone.innerText = selectedFile.name;
};

dropZone.addEventListener("dragover", e => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");

  selectedFile = e.dataTransfer.files[0];
  dropZone.innerText = selectedFile.name;
});

/* PDF UPLOAD */
window.uploadPDF = async function () {
  if (!selectedFile) return alert("No file selected");

  const title = document.getElementById("title").value;
  const section = document.getElementById("section").value;

  const fileRef = ref(storage, `${section}/${Date.now()}-${selectedFile.name}`);

  await uploadBytes(fileRef, selectedFile);
  const url = await getDownloadURL(fileRef);

  const snap = await getDocs(collection(db, "games"));

  snap.forEach(doc => {
    const d = doc.data();

    console.log(d); // DEBUG

    if (d.type !== "pdf") return;

    const card = `
      <div class="card">
        <h3>${d.name}</h3>
        <a class="btn" href="${d.url}" target="_blank">Read</a>
      </div>
    `;

    if (d.section === "english") englishHTML += card;
    if (d.section === "podcasts") podcastHTML += card;
    if (d.section === "magazines") magazineHTML += card;
  });

  alert("PDF uploaded!");
};
</script>

</body>
</html>
