<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel | Greybox Interactive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../style.css">

<style>
#panel { display:none; }

input, select {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  background: #111;
  color: white;
  border: 1px solid #333;
  border-radius: 6px;
}

</style>
</head>

<body>

<nav>
  <h2>Admin Panel</h2>
  <a href="../">Home</a>
</nav>

<header>
  <h1>Greybox Interactive Admin</h1>
  <p>Manage featured games</p>
</header>

<section>

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h2>Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="card" id="panel">

  <h2>Add Game</h2>

  <input id="name" placeholder="Game Name">
  <input id="dev" placeholder="Developer">
  <input id="img" placeholder="Image URL">
  <input id="link" placeholder="Game Link">
  <input id="genre" placeholder="Genre">
  <input id="status" placeholder="Status, e.g. Demo, Released, Coming Soon">
  <input id="description" placeholder="Short Description">

  <button class="btn" onclick="addGame()">Add Game</button>

  <hr>

  <h2>Games</h2>
  <div id="list"></div>

  <button class="btn" onclick="logout()">Logout</button>
</div>

</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
      apiKey: "AIzaSyDH1cqgyywPUm0c7rAemZH_UWy1ToUIDTI",
      authDomain: "greybox-interactive.firebaseapp.com",
      projectId: "greybox-interactive",
      storageBucket: "greybox-interactive.appspot.com",
      messagingSenderId: "389806524436",
      appId: "1:389806524436:web:39b013c9cd4486d623bf01"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const loginBox = document.getElementById("loginBox");
const panel = document.getElementById("panel");

const ADMIN_EMAIL = "danny23912381b@gmail.com";

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[char]));
}

/* LOGIN */
window.login = function () {
  signInWithEmailAndPassword(
    auth,
    document.getElementById("email").value,
    document.getElementById("password").value
  ).catch(err => alert(err.message));
};

window.logout = () => signOut(auth);

/* AUTH */
onAuthStateChanged(auth, user => {
  if (user && user.email === ADMIN_EMAIL) {
    loginBox.style.display = "none";
    panel.style.display = "block";
    loadGames();
  } else {
    loginBox.style.display = "block";
    panel.style.display = "none";

    if (user) signOut(auth);
  }
});

/* GAME SYSTEM */
window.addGame = async function () {
  const name = document.getElementById("name").value;
  const dev = document.getElementById("dev").value;
  const img = document.getElementById("img").value;
  const link = document.getElementById("link").value;
  const genre = document.getElementById("genre").value;
  const status = document.getElementById("status").value;
  const description = document.getElementById("description").value;

  await addDoc(collection(db, "games"), {
    name,
    developer: dev,
    image: img,
    link,
    genre,
    status,
    description
  });

  document.getElementById("name").value = "";
  document.getElementById("dev").value = "";
  document.getElementById("img").value = "";
  document.getElementById("link").value = "";
  document.getElementById("genre").value = "";
  document.getElementById("status").value = "";
  document.getElementById("description").value = "";
  loadGames();
};

async function loadGames() {
  const snap = await getDocs(collection(db, "games"));
  const list = document.getElementById("list");

  list.innerHTML = "";

  snap.forEach(d => {
    const g = d.data();
    const name = safeText(g.name || "Untitled game");
    const developer = safeText(g.developer || "Independent developer");

    list.innerHTML += `
      <div class="card">
        <h3>${name}</h3>
        <p>${developer}</p>
        <a class="btn btn-secondary" href="../game/?id=${d.id}" target="_blank">View Page</a>
        <button class="btn" onclick="deleteGame('${d.id}')">Delete</button>
      </div>
    `;
  });
}

window.deleteGame = async function (id) {
  await deleteDoc(doc(db, "games", id));
  loadGames();
};
</script>

</body>
</html>
