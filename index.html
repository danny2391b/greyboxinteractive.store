<!DOCTYPE html>
<html>
<head>
  <title>Greybox Interactive</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.7;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .card {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      color: white;
    }

    .card:hover {
      background: #2a2a2a;
      transform: scale(1.02);
    }

    .title {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .desc {
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Greybox Interactive</h1>
    <p>Small tools, small indie deveolopers, and downloads built for the web.</p>

    <div class="grid">

      <a class="card" href="/tools">
        <div class="title">Tools</div>
        <div class="desc">Simple web apps and utilities</div>
      </a>

      <a class="card" href="/projects">
        <div class="title">Projects</div>
        <div class="desc">Games and experiments</div>
      </a>

      <a class="card" href="/downloads">
        <div class="title">Downloads</div>
        <div class="desc">Free templates and resources</div>
      </a>

    </div>
  </div>
</body>
</html>
