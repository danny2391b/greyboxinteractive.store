<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login | Greybox</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
:root {
  --accent: #00ffcc;
  --accent2: #0066ff;
}

#panel {
  display: none;
}

input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  background: #111;
  color: white;
  border: 1px solid #333;
  border-radius: 6px;
}
</style>
</head>

<body>

<nav>
  <h2>Admin Panel</h2>
  <a href="index.html">Home</a>
</nav>

<header>
  <h1>Greybox Admin</h1>
  <p>Secure login required</p>
</header>

<section>

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>
  </div>

  <!-- ADMIN PANEL -->
  <div class="card" id="panel">

    <h2>Add Game</h2>

    <input id="name" placeholder="Game Name">
    <input id="dev" placeholder="Developer">
    <input id="img" placeholder="Image URL">
    <input id="link" placeholder="Game Link">

    <button class="btn" onclick="addGame()">Add Game</button>

    <hr>

    <h2>Games</h2>
    <div id="list"></div>

    <button class="btn" onclick="logout()">Logout</button>
  </div>

</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDH1cqgyywPUm0c7rAemZH_UWy1ToUIDTI",
  authDomain: "greybox-interactive.firebaseapp.com",
  projectId: "greybox-interactive",
  storageBucket: "greybox-interactive.firebasestorage.app",
  messagingSenderId: "389806524436",
  appId: "1:389806524436:web:39b013c9cd4486d623bf01"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const loginBox = document.getElementById("loginBox");
const panel = document.getElementById("panel");

window.login = function () {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .catch(err => alert(err.message));
};

window.logout = function () {
  signOut(auth);
};

onAuthStateChanged(auth, user => {
  if (user) {
    loginBox.style.display = "none";
    panel.style.display = "block";
    loadGames();
  } else {
    loginBox.style.display = "block";
    panel.style.display = "none";
  }
});

window.addGame = async function () {
  const name = document.getElementById("name").value;
  const dev = document.getElementById("dev").value;
  const img = document.getElementById("img").value;
  const link = document.getElementById("link").value;

  if (!name || !link) return alert("Fill required fields");

  await addDoc(collection(db, "games"), {
    name,
    developer: dev,
    image: img,
    link
  });

  loadGames();
};

async function loadGames() {
  const snap = await getDocs(collection(db, "games"));
  const list = document.getElementById("list");

  list.innerHTML = "";

  snap.forEach(d => {
    const g = d.data();

    list.innerHTML += `
      <div class="card">
        <h3>${g.name}</h3>
        <p>${g.developer}</p>
        <button class="btn" onclick="deleteGame('${d.id}')">Delete</button>
      </div>
    `;
  });
}

window.deleteGame = async function (id) {
  await deleteDoc(doc(db, "games", id));
  loadGames();
};
</script>

</body>
</html>
