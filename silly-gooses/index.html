<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silly Gooses</title>

<link rel="stylesheet" href="../style.css">
</head>

<body>

<nav>
  <h2>Silly Gooses 🪿</h2>
  <div>
    <a href="../">Home</a>
    <a href="#english">English GCSE</a>
    <a href="#podcasts">Podcasts</a>
    <a href="#magazines">Magazines</a>
  </div>
</nav>

<header>
  <h1>The Silly Gooses 🪿</h1>
  <p>Podcasts, chaos, and questionable ideas.</p>
</header>

<section id="english">
  <h2>English GCSE</h2>
  <div class="grid" id="englishGrid"></div>
</section>

<section id="podcasts">
  <h2>Podcasts</h2>
  <div class="grid" id="podcastGrid"></div>
</section>

<section id="magazines">
  <h2>Magazines</h2>
  <div class="grid" id="magazineGrid"></div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
      apiKey: "AIzaSyDH1cqgyywPUm0c7rAemZH_UWy1ToUIDTI",
      authDomain: "greybox-interactive.firebaseapp.com",
      projectId: "greybox-interactive",
      storageBucket: "greybox-interactive.firebasestorage.app",
      messagingSenderId: "389806524436",
      appId: "1:389806524436:web:39b013c9cd4486d623bf01"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const snap = await getDocs(collection(db, "content"));

snap.forEach(doc => {
  const d = doc.data();

  const card = `
    <div class="card">
      <h3>${d.title}</h3>
      <a class="btn" href="${d.url}" target="_blank">Read</a>
    </div>
  `;

  if (d.section === "english") {
    document.getElementById("englishGrid").innerHTML += card;
  }

  if (d.section === "podcasts") {
    document.getElementById("podcastGrid").innerHTML += card;
  }

  if (d.section === "magazines") {
    document.getElementById("magazineGrid").innerHTML += card;
  }
});
</script>

</body>
</html>
